# branch-protection.yaml
protection:
  master:
    # Требовать проверки статусов
    required_status_checks:
      strict: true
      contexts:
        - continuous-integration/travis-ci
        - continuous-integration/jenkins
        - continuous-integration/github-actions
    
    # Требовать ревью от владельцев кода
    required_pull_request_reviews:
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      required_approving_review_count: 2
    
    # Применять ко всем админам
    enforce_admins: true
    
    # Ограничения на пуш
    restrictions:
      message: "Нельзя пушить в main!"
      users:
        - team-leads
        - admins
      teams:
        - core-developers
    
    # Требовать ревью от последнего коммитера
    require_last_push_approval: true
    
    # Не разрешать force push
    allow_force_pushes: false
    
    # Не разрешать удаление ветки
    allow_deletions: false